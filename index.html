<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black: #0a0a0a;
    --white: #f5f2ee;
    --accent: #c8b89a;
    --dim: rgba(245,242,238,0.45);
    --card-w: 220px;
    --card-h: 300px;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--black);
    color: var(--white);
    overflow: hidden;
    font-family: 'Courier New', monospace;
    /* Prevent rubber-band scroll on iOS */
    overscroll-behavior: none;
    -webkit-overflow-scrolling: touch;
  }

  #c {
    display: block;
    width: 100%; height: 100%;
    position: fixed; top: 0; left: 0;
    touch-action: none;
  }

  /* ── Cursor — hidden on touch devices ── */
  #cursor {
    pointer-events: none;
    position: fixed;
    width: 18px; height: 18px;
    border: 1.5px solid var(--white);
    border-radius: 50%;
    transform: translate(-50%,-50%) scale(1);
    transition: transform 0.18s ease, border-color 0.18s ease;
    z-index: 9999;
    mix-blend-mode: difference;
  }
  #cursor.big {
    transform: translate(-50%,-50%) scale(2.5);
    border-color: var(--accent);
  }
  @media (hover: none) { #cursor { display: none; } }

  /* ── Intro overlay ── */
  #intro {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    pointer-events: none;
    z-index: 100;
  }

  /* Name: fades + rises in, then rises off-screen */
  #name {
    font-family: 'Georgia', serif;
    font-size: clamp(48px, 13vw, 110px);
    font-style: italic;
    letter-spacing: -0.02em;
    color: var(--white);
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.7s ease, transform 0.7s ease;
    will-change: transform, opacity;
  }
  #name.show {
    opacity: 1;
    transform: translateY(0);
  }
  /* Rise up and out after intro completes */
  #name.rise {
    opacity: 0;
    transform: translateY(-120px);
    transition: opacity 0.9s cubic-bezier(0.4,0,0.2,1),
                transform 0.9s cubic-bezier(0.4,0,0.2,1);
  }

  #role {
    font-family: 'Courier New', monospace;
    font-size: clamp(9px, 2.5vw, 13px);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--accent);
    margin-top: 10px;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  #role.show { opacity: 1; }
  #role.rise {
    opacity: 0;
    transition: opacity 0.5s ease;
  }

  #bar-wrap {
    margin-top: 40px;
    width: clamp(80px, 25vw, 120px);
    height: 1px;
    background: rgba(255,255,255,0.15);
    opacity: 0;
    transition: opacity 0.5s ease;
    overflow: hidden;
  }
  #bar-wrap.show { opacity: 1; }
  #bar-wrap.rise { opacity: 0; transition: opacity 0.4s ease; }
  #bar-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width 1.4s cubic-bezier(0.4,0,0.2,1);
  }

  #intro-fade {
    position: fixed; inset: 0;
    background: var(--black);
    z-index: 99;
    opacity: 1;
    pointer-events: none;
    transition: opacity 0.9s ease;
  }
  #intro-fade.gone { opacity: 0; }

  /* ── Popup ── */
  #popup-overlay {
    position: fixed; inset: 0;
    background: rgba(6,5,4,0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: 200;
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  @media (min-width: 600px) {
    #popup-overlay { align-items: center; }
  }
  #popup-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  #popup {
    background: #1a1510;
    color: #e8ddd0;
    width: 100%;
    max-width: 500px;
    padding: 0;
    border-radius: 12px 12px 0 0;
    border: 1px solid rgba(184,160,122,0.12);
    border-bottom: none;
    position: relative;
    transform: translateY(40px);
    transition: transform 0.36s cubic-bezier(0.32,1,0.6,1);
    max-height: 88vh;
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  @media (min-width: 600px) {
    #popup {
      width: min(480px, 92vw);
      border-radius: 4px;
      border: 1px solid rgba(184,160,122,0.15);
      max-height: none;
      transform: translateY(20px) scale(0.97);
    }
  }
  #popup-overlay.open #popup {
    transform: translateY(0) scale(1);
  }

  /* Drag handle strip */
  #popup-handle {
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 12px 0 0;
  }
  #popup-handle span {
    display: block;
    width: 32px; height: 3px;
    background: rgba(184,160,122,0.25);
    border-radius: 2px;
  }
  @media (min-width: 600px) { #popup-handle { display: none; } }

  /* Scrollable body */
  #popup-body {
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 20px 24px;
    padding-bottom: max(28px, env(safe-area-inset-bottom, 20px));
    flex: 1;
  }
  @media (min-width: 600px) {
    #popup-body { padding: 32px 36px 36px; }
  }

  /* Header row inside body */
  #popup-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 6px;
  }

  #popup-close {
    flex-shrink: 0;
    background: rgba(184,160,122,0.08);
    border: 1px solid rgba(184,160,122,0.18);
    border-radius: 50%;
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: rgba(184,160,122,0.7);
    font-size: 18px; line-height: 1;
    transition: background 0.18s, color 0.18s;
    -webkit-tap-highlight-color: transparent;
    margin-top: 2px;

  #popup-close:hover, #popup-close:active {
    background: rgba(184,160,122,0.18);
    color: #e8ddd0;
  }

  #popup-tag {
    font-family: 'Courier New', monospace;
    font-size: 9px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: rgba(184,160,122,0.6);

  #popup-title {
    font-family: 'Georgia', serif;
    font-style: italic;
    font-size: clamp(22px, 5vw, 28px);
    line-height: 1.12;
    color: #e8ddd0;
    flex: 1;
  }

  /* Divider */
  #popup-divider {
    width: 100%; height: 1px;
    background: rgba(184,160,122,0.12);
    margin: 16px 0;

  #popup-desc {

  #popup-link {
    display: flex; align-items: center; gap: 8px;
    background: transparent;
    border: 1px solid rgba(184,160,122,0.3);
    color: #b8a07a;
    font-family: 'Courier New', monospace;

    letter-spacing: 0.18em;

    color: #e8ddd0;

    margin-top: 16px;

    border-radius: 2px;

  /* ── Nav hint ── */
  #hint {
    position: fixed;
    bottom: max(24px, env(safe-area-inset-bottom, 16px));

    transform: translateX(-50%);

  }

  /* ── Safe area padding for notches ── */
  @supports (padding: max(0px)) {
    body {
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
  }
</style>

/* ══════════════════════════════════════
   EASING — declared first, used everywhere
══════════════════════════════════════ */
function easeOutBack(t) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}
function easeOutCubic(t) {
  return 1 - Math.pow(1 - t, 3);
}
function easeInOutQuad(t) {
  return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2;
}

/* ══════════════════════════════════════
   RESPONSIVE METRICS
══════════════════════════════════════ */
function getMetrics() {
  const W = window.innerWidth, H = window.innerHeight;
  const minDim = Math.min(W, H);
  if (W < 380) {
    // Small phones — ring slightly further, camera nudged back just enough
    return { CW: 90, CH: 122, R: Math.min(155, minDim * 0.43), camZ: 60 };
  } else if (W < 480) {
    return { CW: 108, CH: 146, R: Math.min(175, minDim * 0.46), camZ: 55 };
  } else if (W < 600) {
    return { CW: 135, CH: 184, R: Math.min(210, minDim * 0.50), camZ: 40 };
  } else {
    return { CW: 220, CH: 300, R: 420, camZ: 0 };
  }
}

/* ══════════════════════════════════════
   CARD CANVAS DRAWING — website previews
══════════════════════════════════════ */
const CARD_BG   = '#16120e';
const CARD_MID  = '#1e1912';
const CARD_ACC  = '#b8a07a';
const CARD_TEXT = '#e8ddd0';
const CARD_DIM  = '#7a6e60';

function drawUnifiedBase(ctx, W, H) {
  ctx.fillStyle = CARD_BG;
  ctx.fillRect(0, 0, W, H);
  // Grain
  for (let i = 0; i < 280; i++) {
    ctx.fillStyle = `rgba(255,240,210,${Math.random() * 0.022})`;
    ctx.fillRect(Math.random() * W, Math.random() * H, 1, 1);
  }
  // Subtle top-left warmth
  const grd = ctx.createRadialGradient(W * 0.15, H * 0.15, 0, W * 0.15, H * 0.15, W * 0.85);
  grd.addColorStop(0, 'rgba(200,170,110,0.06)');
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);
}

// Shared browser chrome at top of card
function drawBrowserChrome(ctx, W, topH) {
  // Bar background
  ctx.fillStyle = 'rgba(30,25,18,0.95)';
  ctx.fillRect(0, 0, W, topH);
  // Bottom border of bar
  ctx.fillStyle = `rgba(184,160,122,0.12)`;
  ctx.fillRect(0, topH - 0.5, W, 0.5);
  // 3 dots
  const r = topH * 0.18, y = topH * 0.5;
  ['rgba(184,160,122,0.5)', 'rgba(184,160,122,0.3)', 'rgba(184,160,122,0.2)'].forEach((c, i) => {
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.arc(W * 0.08 + i * (r * 2.8), y, r, 0, Math.PI * 2); ctx.fill();
  });
  // URL pill
  const px = W * 0.22, pw = W * 0.58, ph = topH * 0.45, py = y - ph / 2;
  ctx.fillStyle = 'rgba(184,160,122,0.08)';
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(px, py, pw, ph, ph / 2) : ctx.rect(px, py, pw, ph);
  ctx.fill();
}

const CARD_STYLES = {
  ecommerce(ctx, W, H, p) {
    drawUnifiedBase(ctx, W, H);
    const bh = H * 0.52;
    drawBrowserChrome(ctx, W, H * 0.1);
    // Hero product image area
    ctx.fillStyle = 'rgba(184,160,122,0.07)';
    ctx.fillRect(W * 0.08, H * 0.13, W * 0.84, bh * 0.52);
    // Horizontal product image grid
    const cols = 3, gapX = W * 0.03, itemW = (W * 0.84 - gapX * (cols - 1)) / cols;
    for (let c = 0; c < cols; c++) {
      ctx.fillStyle = `rgba(184,160,122,${0.08 + c * 0.03})`;
      const ix = W * 0.08 + c * (itemW + gapX);
      ctx.fillRect(ix, H * 0.38, itemW, H * 0.22);
    }
    // Price tag lines
    ctx.fillStyle = 'rgba(184,160,122,0.35)';
    ctx.fillRect(W * 0.08, H * 0.63, W * 0.25, H * 0.025);
    ctx.fillStyle = 'rgba(184,160,122,0.15)';
    ctx.fillRect(W * 0.08, H * 0.665, W * 0.18, H * 0.02);
    drawCardText(ctx, W, H, p, CARD_TEXT, CARD_ACC);
  },

  agency(ctx, W, H, p) {
    drawUnifiedBase(ctx, W, H);
    drawBrowserChrome(ctx, W, H * 0.1);
    // Full-bleed hero
    ctx.fillStyle = 'rgba(184,160,122,0.05)';
    ctx.fillRect(W * 0.04, H * 0.13, W * 0.92, H * 0.44);
    // X on hero
    ctx.strokeStyle = `rgba(184,160,122,0.3)`; ctx.lineWidth = 0.7;
    const cx = W * 0.5, cy = H * 0.35, s = H * 0.1;
    ctx.beginPath(); ctx.moveTo(cx - s, cy - s); ctx.lineTo(cx + s, cy + s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + s, cy - s); ctx.lineTo(cx - s, cy + s); ctx.stroke();
    // Nav links
    for (let i = 0; i < 4; i++) {
      ctx.fillStyle = 'rgba(184,160,122,0.2)';
      ctx.fillRect(W * (0.35 + i * 0.15), H * 0.05, W * 0.08, H * 0.018);
    }
    drawCardText(ctx, W, H, p, CARD_TEXT, CARD_ACC);

function drawCardText(ctx, W, H, p, textColor, accentColor) {
  // Subtle bottom gradient overlay to ensure text legibility
  const legGrd = ctx.createLinearGradient(0, H*0.65, 0, H);
  legGrd.addColorStop(0, 'rgba(22,18,14,0)');
  legGrd.addColorStop(1, 'rgba(22,18,14,0.72)');
  ctx.fillStyle = legGrd;
  ctx.fillRect(0, H*0.65, W, H*0.35);

  // Tag
  ctx.fillStyle = accentColor;
  ctx.font = `${Math.max(7, W*0.038)}px "Courier New"`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.globalAlpha = 0.8;
  ctx.fillText(p.tag.toUpperCase(), W*0.1, H*0.82);
  ctx.globalAlpha = 1;

  // Title
  ctx.fillStyle = textColor;
  ctx.font = `italic ${Math.max(11, W*0.07)}px Georgia, serif`;
  ctx.textAlign = 'left';
  const titleWords = p.title.split(' ');
  if (titleWords.length > 1 && W < 160) {
    ctx.fillText(titleWords[0], W*0.1, H*0.88);
    ctx.fillText(titleWords.slice(1).join(' '), W*0.1, H*0.88 + W*0.08);
  } else {
    ctx.fillText(p.title, W*0.1, H*0.88);
  }

  // Bottom separator
  ctx.strokeStyle = accentColor;
  ctx.lineWidth = 0.7; ctx.globalAlpha = 0.25;
  ctx.beginPath(); ctx.moveTo(W*0.1, H*0.76); ctx.lineTo(W*0.9, H*0.76); ctx.stroke();
  ctx.globalAlpha = 1;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);
  ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);
  ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r);
  ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}

function makeCardTexture(project, CW, CH) {
  const canvas = document.createElement('canvas');
  const scale = window.devicePixelRatio || 2;
  canvas.width = CW * scale;
  canvas.height = CH * scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);

  const drawFn = CARD_STYLES[project.id];
  if (drawFn) drawFn(ctx, CW, CH, project);

  const tex = new THREE.CanvasTexture(canvas);
  tex.minFilter = THREE.LinearFilter;
  return tex;
}

(function buildParticles() {

    size: 1.6,

    sizeAttenuation: true,

/* ══════════════════════════════════════
   BUILD CARDS
══════════════════════════════════════ */
let metrics = getMetrics();
let { CW, CH, R } = metrics;

const cardMeshes = [];
const cardGroup = new THREE.Group();
scene.add(cardGroup);

function buildCards() {
  // Clear old
  while (cardGroup.children.length) { cardGroup.remove(cardGroup.children[0]); }
  cardMeshes.length = 0;

  const { CW: cw, CH: ch } = getMetrics();

  PROJECTS.forEach((proj, i) => {
    const texture = makeCardTexture(proj, cw, ch);
    const geo = new THREE.PlaneGeometry(cw, ch);
    const mat = new THREE.MeshStandardMaterial({
      map: texture,
      side: THREE.FrontSide,
      roughness: 0.85,
      metalness: 0.0,
      envMapIntensity: 0.5,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.userData = { project: proj, index: i };

    // Card back (warm dark panel)
    const backGeo = new THREE.PlaneGeometry(cw, ch);
    const backMat = new THREE.MeshStandardMaterial({ color: 0x13100c, roughness: 0.95 });
    const back = new THREE.Mesh(backGeo, backMat);
    back.rotation.y = Math.PI;
    mesh.add(back);

    cardGroup.add(mesh);
    cardMeshes.push(mesh);
  });
}

buildCards();

function getRingPos(i, Rcur, angleOffset) {
  const baseAngle = (i / N) * Math.PI * 2 + angleOffset;
  return {
    x: Math.sin(baseAngle) * Rcur,
    y: 0,
    z: -Math.cos(baseAngle) * Rcur,
    ry: baseAngle + Math.PI * 2, // face inward
  };
}

window.addEventListener('wheel', e => {
  if (!introComplete) return;
  e.preventDefault();
  const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  carousel.targetAngle += delta * 0.003;
  carousel.lastIdle = clock;
}, { passive: false });

/* ══════════════════════════════════════
   MOUSE DRAG
══════════════════════════════════════ */
document.addEventListener('mousedown', e => {
  if (!introComplete) return;
  isDragging = true;
  lastDragX = e.clientX;
});
document.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const dx = e.clientX - lastDragX;
  carousel.targetAngle -= dx * 0.004;
  lastDragX = e.clientX;
  carousel.lastIdle = clock;
});
document.addEventListener('mouseup', () => { isDragging = false; });

/* ══════════════════════════════════════
   TOUCH
══════════════════════════════════════ */
document.addEventListener('touchstart', e => {
  if (!introComplete) return;
  touchStartX = touchLastX = e.touches[0].clientX;
  touchVX = 0;
}, { passive: true });

document.addEventListener('touchmove', e => {
  if (!introComplete) return;
  const x = e.touches[0].clientX;
  const dx = x - touchLastX;
  touchVX = dx;
  // Slightly increased sensitivity on mobile
  const sensitivity = window.innerWidth < 480 ? 0.007 : 0.005;
  carousel.targetAngle -= dx * sensitivity;
  touchLastX = x;
  carousel.lastIdle = clock;
}, { passive: true });

document.addEventListener('touchend', e => {
  if (!introComplete) return;
  // Momentum flick
  const sensitivity = window.innerWidth < 480 ? 0.007 : 0.005;
  carousel.targetAngle -= touchVX * 6 * sensitivity;
});

/* ══════════════════════════════════════
   CLICK / TAP
══════════════════════════════════════ */
let tapStartX = 0, tapStartY = 0;
document.addEventListener('touchstart', e => {
  tapStartX = e.touches[0].clientX;
  tapStartY = e.touches[0].clientY;
}, { passive: true });

document.addEventListener('click', e => {
  if (!introComplete) return;
  if (popupOverlay.classList.contains('open')) return;

  // On touch: check it wasn't a swipe (moved >12px)
  if (e.isTrusted && e.detail === 0) {
    // touch-generated click — skip swipe check
  } else {
    // mouse click: use raycaster hover
    if (hoveredCard) openPopup(hoveredCard.userData.project);
    return;
  }

  // Touch tap: raycast from tap position
  const rect = renderer.domElement.getBoundingClientRect();
  const tapX = ((e.clientX - rect.left) / rect.width)  *  2 - 1;
  const tapY = ((e.clientY - rect.top)  / rect.height) * -2 + 1;
  const tap2D = new THREE.Vector2(tapX, tapY);
  const tapRay = new THREE.Raycaster();
  tapRay.setFromCamera(tap2D, camera);
  const hits = tapRay.intersectObjects(cardMeshes, false);
  if (hits.length > 0) openPopup(hits[0].object.userData.project);
});

/* ══════════════════════════════════════
   RAYCASTER
══════════════════════════════════════ */
const raycaster = new THREE.Raycaster();
const mouse2D   = new THREE.Vector2();

/* ══════════════════════════════════════
   RESIZE
══════════════════════════════════════ */
function onResize() {
  const W = window.innerWidth, H = window.innerHeight;
  renderer.setSize(W, H);
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
  metrics = getMetrics();
  ({ CW, CH, R } = metrics);
  // Rebuild cards if size bucket changed
  buildCards();
}
window.addEventListener('resize', onResize);
onResize();

/* ══════════════════════════════════════
   MAIN LOOP
══════════════════════════════════════ */
let lastTime = performance.now();

function animate(now) {
  requestAnimationFrame(animate);

  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;
  clock += dt;

  const { CW: cw, CH: ch, R: Rcur } = getMetrics();

  // ── Phase 0: Intro animation ──
  if (phase === 0) {

    // Camera pull-back: starts at R*1.5, eases to camZ by INTRO_FADE
    const mCamZ = getMetrics().camZ;
    if (clock < INTRO_FADE) {
      const t = Math.min(clock / INTRO_FADE, 1);
      camera.position.z = mCamZ + Rcur * 1.5 * (1 - easeOutCubic(t));
    } else {
      camera.position.z = mCamZ;
    }
    camera.position.x = 0;
    camera.position.y = 0;
    camera.lookAt(0, 0, camera.position.z - 1);

    // Position each card
    cardMeshes.forEach((mesh, i) => {
      const flyDelay = FLY_START + i * STAGGER;
      const ring = getRingPos(i, Rcur, carousel.angle);

      if (clock < flyDelay) {
        // Scattered, spinning
        const s = scatter[i];
        mesh.position.set(s.px, s.py, s.pz);
        mesh.rotation.x = s.rx + clock * 0.3;
        mesh.rotation.y = s.ry + clock * 0.5;
        mesh.rotation.z = s.rz + clock * 0.2;

      } else {
        // Flying to ring
        const t = Math.min((clock - flyDelay) / FLY_DUR, 1);
        const ease = easeOutBack(t);

        const s = scatter[i];
        mesh.position.x = s.px + (ring.x - s.px) * ease;
        mesh.position.y = s.py + (ring.y - s.py) * ease;
        mesh.position.z = s.pz + (ring.z - s.pz) * ease;

        // Rotate to face-in
        const targetRY = ring.ry;
        const startRY  = s.ry;
        mesh.rotation.x = s.rx * (1 - ease);
        mesh.rotation.y = startRY + (targetRY - startRY) * ease;
        mesh.rotation.z = s.rz * (1 - ease);
      }
    });

    // Overlay fade
    if (clock >= INTRO_FADE) {
      introFade.classList.add('gone');
    }

    // Switch to phase 1
    if (clock >= PHASE1_T) {
      phase = 1;
      introComplete = true;
      carousel.lastIdle = clock;
      setTimeout(() => hintEl.classList.add('show'), 400);
    }

  // ── Phase 1: Interactive carousel ──
  } else {

    // Auto-rotate
    const idleTime = clock - carousel.lastIdle;
    if (idleTime > 3) {
      carousel.targetAngle += carousel.autoRotateSpeed * 60 * dt;
    }

    // Smooth angle
    const angleDiff = carousel.targetAngle - carousel.angle;
    carousel.angle += angleDiff * Math.min(dt * 8, 0.95);

    // Position all cards
    cardMeshes.forEach((mesh, i) => {
      const ring = getRingPos(i, Rcur, carousel.angle);
      mesh.position.set(ring.x,  ring.y, ring.z);
      mesh.rotation.set(0, ring.ry, 0);
    });

    // Camera — pulled back on mobile for better overview
    const targetCamZ = getMetrics().camZ;
    camera.position.set(0, 0, targetCamZ);
    camera.lookAt(0, 0, targetCamZ - 1);

    // Raycaster for hover
    mouse2D.set(mouseX, mouseY);
    raycaster.setFromCamera(mouse2D, camera);
    const hits = raycaster.intersectObjects(cardMeshes, false);
    const newHovered = hits.length > 0 ? hits[0].object : null;

    if (newHovered !== hoveredCard) {
      hoveredCard = newHovered;
      cursorEl.classList.toggle('big', !!hoveredCard);
    }

    // Scale hovered card
    cardMeshes.forEach(mesh => {
      const target = mesh === hoveredCard ? 1.06 : 1.0;
      mesh.scale.setScalar(mesh.scale.x + (target - mesh.scale.x) * Math.min(dt * 10, 1));
    });
  }

  renderer.render(scene, camera);
}

requestAnimationFrame(animate);
</script>
</body>
</html>
