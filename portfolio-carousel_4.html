<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>hatori — creative developer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black: #0a0a0a;
    --white: #f5f2ee;
    --accent: #c8b89a;
    --dim: rgba(245,242,238,0.45);
    --card-w: 220px;
    --card-h: 300px;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--black);
    color: var(--white);
    overflow: hidden;
    font-family: 'Courier New', monospace;
  }

  #c {
    display: block;
    width: 100%; height: 100%;
    position: fixed; top: 0; left: 0;
    touch-action: none;
  }

  /* ── Cursor ── */
  #cursor {
    pointer-events: none;
    position: fixed;
    width: 18px; height: 18px;
    border: 1.5px solid var(--white);
    border-radius: 50%;
    transform: translate(-50%,-50%) scale(1);
    transition: transform 0.18s ease, border-color 0.18s ease;
    z-index: 9999;
    mix-blend-mode: difference;
  }
  #cursor.big {
    transform: translate(-50%,-50%) scale(2.5);
    border-color: var(--accent);
  }
  @media (hover: none) { #cursor { display: none; } }

  /* ── Intro overlay ── */
  #intro {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    pointer-events: none;
    z-index: 100;
  }

  #name {
    font-family: 'Georgia', serif;
    font-size: clamp(52px, 10vw, 110px);
    font-style: italic;
    letter-spacing: -0.02em;
    color: var(--white);
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.7s ease, transform 0.7s ease;
  }
  #name.show { opacity: 1; transform: translateY(0); }

  #role {
    font-family: 'Courier New', monospace;
    font-size: clamp(10px, 2vw, 13px);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--accent);
    margin-top: 10px;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  #role.show { opacity: 1; }

  #bar-wrap {
    margin-top: 40px;
    width: 120px;
    height: 1px;
    background: rgba(255,255,255,0.15);
    opacity: 0;
    transition: opacity 0.5s ease;
    overflow: hidden;
  }
  #bar-wrap.show { opacity: 1; }
  #bar-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width 1.4s cubic-bezier(0.4,0,0.2,1);
  }

  #intro-fade {
    position: fixed; inset: 0;
    background: var(--black);
    z-index: 99;
    opacity: 1;
    pointer-events: none;
    transition: opacity 0.9s ease;
  }
  #intro-fade.gone { opacity: 0; }

  /* ── Popup ── */
  #popup-overlay {
    position: fixed; inset: 0;
    background: rgba(10,10,10,0.75);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 200;
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
  }
  #popup-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  #popup {
    background: #f5f2ee;
    color: #0a0a0a;
    width: min(420px, 92vw);
    padding: 36px 36px 28px;
    position: relative;
    transform: translateY(20px) scale(0.97);
    transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
    border: 1px solid rgba(0,0,0,0.08);
  }
  #popup-overlay.open #popup {
    transform: translateY(0) scale(1);
  }

  #popup-tag {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #888;
    margin-bottom: 10px;
  }
  #popup-title {
    font-family: 'Georgia', serif;
    font-style: italic;
    font-size: 26px;
    line-height: 1.15;
    margin-bottom: 14px;
    color: #0a0a0a;
  }
  #popup-desc {
    font-family: 'Courier New', monospace;
    font-size: 12px;
    line-height: 1.8;
    color: #444;
    margin-bottom: 22px;
  }
  #popup-link {
    display: inline-block;
    background: #0a0a0a;
    color: #f5f2ee;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    text-decoration: none;
    padding: 10px 20px;
    cursor: pointer;
    border: none;
    transition: background 0.2s;
  }
  #popup-link:hover { background: #333; }

  #popup-techs {
    margin-top: 18px;
    display: flex; flex-wrap: wrap; gap: 6px;
  }
  .tech-tag {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    padding: 4px 10px;
    border: 1px solid rgba(0,0,0,0.18);
    color: #666;
    text-transform: uppercase;
  }

  #popup-close {
    position: absolute;
    top: 14px; right: 16px;
    background: none; border: none;
    font-size: 20px; cursor: pointer;
    color: #999; line-height: 1;
    padding: 4px;
    transition: color 0.15s;
  }
  #popup-close:hover { color: #0a0a0a; }

  /* ── Nav hint ── */
  #hint {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Courier New', monospace;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--dim);
    opacity: 0;
    transition: opacity 1s ease;
    z-index: 50;
    white-space: nowrap;
    pointer-events: none;
  }
  #hint.show { opacity: 1; }
</style>
</head>

/* ══════════════════════════════════════
   EASING — declared first, used everywhere
══════════════════════════════════════ */
function easeOutBack(t) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}
function easeOutCubic(t) {
  return 1 - Math.pow(1 - t, 3);
}
function easeInOutQuad(t) {
  return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2;
}

/* ══════════════════════════════════════
   RESPONSIVE METRICS
══════════════════════════════════════ */
function getMetrics() {
  const W = window.innerWidth, H = window.innerHeight;
  const minDim = Math.min(W, H);
  if (W < 400) {
    return { CW: 115, CH: 156, R: Math.min(185, minDim * 0.48) };
  } else if (W < 600) {
    return { CW: 145, CH: 196, R: Math.min(230, minDim * 0.52) };
  } else {
    return { CW: 220, CH: 300, R: 420 };
  }
}

/* ══════════════════════════════════════
   CARD CANVAS DRAWING
══════════════════════════════════════ */
const CARD_STYLES = {
  ecommerce(ctx, W, H, p) {
    // Warm cream background with subtle grid
    ctx.fillStyle = '#f7f0e6';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(180,160,130,0.2)';
    ctx.lineWidth = 0.5;
    for (let x = 0; x < W; x += 20) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    for (let y = 0; y < H; y += 20) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
    // Botanical circle
    ctx.strokeStyle = '#c8a96e';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(W/2, H*0.4, H*0.18, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(W/2, H*0.4, H*0.12, 0, Math.PI*2); ctx.stroke();
    // Petal marks
    for (let i = 0; i < 8; i++) {
      const a = (i/8)*Math.PI*2;
      ctx.beginPath();
      ctx.moveTo(W/2 + Math.cos(a)*H*0.13, H*0.4 + Math.sin(a)*H*0.13);
      ctx.lineTo(W/2 + Math.cos(a)*H*0.17, H*0.4 + Math.sin(a)*H*0.17);
      ctx.stroke();
    }
    drawCardText(ctx, W, H, p, '#3a2e1e', '#8a6a3a');
  },

  agency(ctx, W, H, p) {
    ctx.fillStyle = '#0d0d0d';
    ctx.fillRect(0, 0, W, H);
    // Bold diagonal stripe
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(W*0.6,0); ctx.lineTo(W,H*0.5); ctx.lineTo(W,H); ctx.lineTo(W*0.4,H); ctx.lineTo(0,H*0.5); ctx.closePath(); ctx.fill();
    // X mark
    ctx.strokeStyle = '#e8d5a0';
    ctx.lineWidth = 2;
    const cx = W/2, cy = H*0.38, s = H*0.1;
    ctx.beginPath(); ctx.moveTo(cx-s,cy-s); ctx.lineTo(cx+s,cy+s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx+s,cy-s); ctx.lineTo(cx-s,cy+s); ctx.stroke();
    ctx.strokeStyle = '#e8d5a0'; ctx.lineWidth = 1.5;
    ctx.strokeRect(cx-s*1.5, cy-s*1.5, s*3, s*3);
    drawCardText(ctx, W, H, p, '#f0e8d0', '#e8d5a0');
  },

  saas(ctx, W, H, p) {
    ctx.fillStyle = '#f0f4ff';
    ctx.fillRect(0, 0, W, H);
    // Grid of dots
    ctx.fillStyle = 'rgba(80,100,200,0.2)';
    for (let x = W*0.1; x < W; x += 18) {
      for (let y = H*0.15; y < H*0.7; y += 18) {
        ctx.beginPath(); ctx.arc(x, y, 1.5, 0, Math.PI*2); ctx.fill();
      }
    }
    // Bar chart
    const bars = [0.4,0.65,0.5,0.8,0.6,0.9];
    const bw = W*0.09, gap = W*0.045;
    const startX = W/2 - (bars.length*(bw+gap))/2;
    bars.forEach((v, i) => {
      const bh = H*0.22*v;
      const gradient = ctx.createLinearGradient(0, H*0.55-bh, 0, H*0.55);
      gradient.addColorStop(0, '#5064dc');
      gradient.addColorStop(1, '#a0aaff');
      ctx.fillStyle = gradient;
      ctx.fillRect(startX + i*(bw+gap), H*0.55-bh, bw, bh);
    });
    drawCardText(ctx, W, H, p, '#1a2060', '#5064dc');
  },

  portfolio(ctx, W, H, p) {
    ctx.fillStyle = '#1a1410';
    ctx.fillRect(0, 0, W, H);
    // Film grain simulation
    for (let i = 0; i < 1200; i++) {
      const gx = Math.random()*W, gy = Math.random()*H;
      const a = Math.random()*0.15;
      ctx.fillStyle = `rgba(255,245,220,${a})`;
      ctx.fillRect(gx, gy, 1, 1);
    }
    // Photo placeholder
    ctx.strokeStyle = '#8a7060';
    ctx.lineWidth = 1;
    ctx.strokeRect(W*0.15, H*0.12, W*0.7, H*0.45);
    ctx.beginPath();
    ctx.moveTo(W*0.15, H*0.12); ctx.lineTo(W*0.85, H*0.57);
    ctx.moveTo(W*0.85, H*0.12); ctx.lineTo(W*0.15, H*0.57);
    ctx.strokeStyle = 'rgba(138,112,96,0.4)'; ctx.stroke();
    drawCardText(ctx, W, H, p, '#f0e0c8', '#8a7060');
  },

  brand(ctx, W, H, p) {
    ctx.fillStyle = '#1c0f06';
    ctx.fillRect(0, 0, W, H);
    // Label shape
    ctx.fillStyle = '#d4a55a';
    ctx.beginPath();
    ctx.moveTo(W/2, H*0.1); ctx.lineTo(W*0.85, H*0.28); ctx.lineTo(W*0.85, H*0.55);
    ctx.lineTo(W/2, H*0.65); ctx.lineTo(W*0.15, H*0.55); ctx.lineTo(W*0.15, H*0.28);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#1c0f06';
    ctx.beginPath();
    ctx.moveTo(W/2, H*0.16); ctx.lineTo(W*0.78, H*0.31); ctx.lineTo(W*0.78, H*0.52);
    ctx.lineTo(W/2, H*0.6); ctx.lineTo(W*0.22, H*0.52); ctx.lineTo(W*0.22, H*0.31);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#d4a55a';
    ctx.font = `bold ${W*0.1}px serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('M', W/2, H*0.38);
    drawCardText(ctx, W, H, p, '#f0d8a0', '#d4a55a');
  },

  dashboard(ctx, W, H, p) {
    ctx.fillStyle = '#060e1a';
    ctx.fillRect(0, 0, W, H);
    // Line chart
    const pts = [0.7,0.5,0.65,0.3,0.45,0.2,0.35,0.55,0.25,0.4];
    const cx2 = W*0.1, cy2 = H*0.55, chartW = W*0.8, chartH = H*0.3;
    ctx.beginPath();
    pts.forEach((v, i) => {
      const x = cx2 + (i/(pts.length-1))*chartW;
      const y = cy2 - v*chartH;
      i === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    });
    ctx.strokeStyle = '#00d4ff'; ctx.lineWidth = 1.5; ctx.stroke();
    // Fill under
    ctx.lineTo(cx2+chartW, cy2); ctx.lineTo(cx2, cy2); ctx.closePath();
    const grad = ctx.createLinearGradient(0,cy2-chartH,0,cy2);
    grad.addColorStop(0,'rgba(0,212,255,0.3)'); grad.addColorStop(1,'rgba(0,212,255,0)');
    ctx.fillStyle = grad; ctx.fill();
    // Grid lines
    ctx.strokeStyle = 'rgba(0,212,255,0.15)'; ctx.lineWidth = 0.5;
    for (let i = 1; i < 4; i++) {
      ctx.beginPath(); ctx.moveTo(cx2, cy2-i*chartH/4); ctx.lineTo(cx2+chartW, cy2-i*chartH/4); ctx.stroke();
    }
    drawCardText(ctx, W, H, p, '#c0e8ff', '#00d4ff');
  },

  mobile(ctx, W, H, p) {
    ctx.fillStyle = '#f8f5f0';
    ctx.fillRect(0, 0, W, H);
    // Phone outline
    const ph = H*0.45, pw = ph*0.5, px = W/2-pw/2, py = H*0.1;
    ctx.strokeStyle = '#2a2a2a'; ctx.lineWidth = 2;
    roundRect(ctx, px, py, pw, ph, pw*0.12); ctx.stroke();
    // Screen
    ctx.fillStyle = '#e8e0d0';
    roundRect(ctx, px+pw*0.07, py+ph*0.06, pw*0.86, ph*0.78, pw*0.06); ctx.fill();
    // Map lines inside screen
    ctx.strokeStyle = '#b0a898'; ctx.lineWidth = 0.5;
    for (let y = py+ph*0.12; y < py+ph*0.82; y += ph*0.07) {
      ctx.beginPath(); ctx.moveTo(px+pw*0.1,y); ctx.lineTo(px+pw*0.9,y); ctx.stroke();
    }
    // Pin
    ctx.fillStyle = '#e04040';
    ctx.beginPath(); ctx.arc(W/2, py+ph*0.42, pw*0.08, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(W/2-pw*0.08, py+ph*0.42); ctx.lineTo(W/2, py+ph*0.55); ctx.lineTo(W/2+pw*0.08, py+ph*0.42); ctx.fill();
    drawCardText(ctx, W, H, p, '#1a1210', '#e04040');
  },

  fashion(ctx, W, H, p) {
    ctx.fillStyle = '#f5ede2';
    ctx.fillRect(0, 0, W, H);
    // Silhouette abstract
    ctx.fillStyle = '#1a0a00';
    ctx.beginPath();
    ctx.moveTo(W*0.35, H*0.1);
    ctx.bezierCurveTo(W*0.3, H*0.15, W*0.25, H*0.25, W*0.28, H*0.35);
    ctx.bezierCurveTo(W*0.22, H*0.35, W*0.2, H*0.45, W*0.25, H*0.55);
    ctx.bezierCurveTo(W*0.2, H*0.6, W*0.18, H*0.7, W*0.22, H*0.8);
    ctx.lineTo(W*0.4, H*0.8);
    ctx.bezierCurveTo(W*0.38, H*0.6, W*0.42, H*0.45, W*0.4, H*0.35);
    ctx.bezierCurveTo(W*0.45, H*0.3, W*0.48, H*0.25, W*0.45, H*0.15);
    ctx.closePath(); ctx.fill();
    // Fabric lines
    ctx.strokeStyle = 'rgba(180,140,100,0.4)'; ctx.lineWidth = 0.5;
    for (let i = 0; i < 5; i++) {
      ctx.beginPath(); ctx.moveTo(W*0.55+i*W*0.06, H*0.2); ctx.lineTo(W*0.65+i*W*0.04, H*0.75); ctx.stroke();
    }
    drawCardText(ctx, W, H, p, '#1a0a00', '#8a6040');
  },

  interactive(ctx, W, H, p) {
    ctx.fillStyle = '#08001a';
    ctx.fillRect(0, 0, W, H);
    // Particle system
    const colors = ['#ff00aa','#00ffcc','#ffee00','#aa00ff'];
    for (let i = 0; i < 80; i++) {
      const angle = (i/80)*Math.PI*2;
      const r = H*0.12 + H*0.08*Math.sin(i*0.8);
      const x = W/2 + Math.cos(angle)*r + (Math.random()-0.5)*W*0.25;
      const y = H*0.38 + Math.sin(angle)*r*0.6 + (Math.random()-0.5)*H*0.12;
      ctx.fillStyle = colors[i%4];
      ctx.globalAlpha = 0.6 + Math.random()*0.4;
      ctx.beginPath(); ctx.arc(x,y,1+Math.random()*2,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    drawCardText(ctx, W, H, p, '#e0c0ff', '#ff00aa');
  },

  blog(ctx, W, H, p) {
    ctx.fillStyle = '#fefaf4';
    ctx.fillRect(0, 0, W, H);
    // Text lines
    const lineH = H*0.038, startY = H*0.12, lineX = W*0.1;
    const lineW = [W*0.8, W*0.7, W*0.75, W*0.65, W*0.78, W*0.6, W*0.72, W*0.5];
    lineW.forEach((lw, i) => {
      ctx.fillStyle = i === 0 ? '#1a1410' : (i < 3 ? 'rgba(26,20,16,0.7)' : 'rgba(26,20,16,0.4)');
      const h = i === 0 ? lineH*1.4 : lineH;
      ctx.fillRect(lineX, startY + i*(lineH + H*0.02), lw, h);
    });
    // Pull quote line
    ctx.fillStyle = '#c8a878';
    ctx.fillRect(lineX, startY + 8*(lineH + H*0.02), W*0.04, lineH*5);
    drawCardText(ctx, W, H, p, '#1a1410', '#a07840');
  },

  booking(ctx, W, H, p) {
    ctx.fillStyle = '#e8f4f0';
    ctx.fillRect(0, 0, W, H);
    // Calendar grid
    const days = 7, rows = 5;
    const cx3 = W*0.1, cy3 = H*0.14, cellW = W*0.8/days, cellH = H*0.46/rows;
    ctx.strokeStyle = 'rgba(0,100,80,0.2)'; ctx.lineWidth = 0.5;
    for (let r = 0; r <= rows; r++) {
      ctx.beginPath(); ctx.moveTo(cx3,cy3+r*cellH); ctx.lineTo(cx3+days*cellW,cy3+r*cellH); ctx.stroke();
    }
    for (let d = 0; d <= days; d++) {
      ctx.beginPath(); ctx.moveTo(cx3+d*cellW,cy3); ctx.lineTo(cx3+d*cellW,cy3+rows*cellH); ctx.stroke();
    }
    // Booked dots
    [[1,1],[3,2],[2,3],[4,1],[0,4],[5,2],[6,3]].forEach(([d,r]) => {
      ctx.fillStyle = '#00a880';
      ctx.beginPath();
      ctx.arc(cx3+(d+0.5)*cellW, cy3+(r+0.5)*cellH, cellW*0.25, 0, Math.PI*2);
      ctx.fill();
    });
    drawCardText(ctx, W, H, p, '#003828', '#00a880');
  },

  ai(ctx, W, H, p) {
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, 0, W, H);
    // Neural network
    const layers = [[1],[3],[4],[3],[1]];
    const layerX = layers.map((_,i) => W*0.15 + (i/(layers.length-1))*W*0.7);
    const nodes = layers.map((l,li) => l[0] === 1 ? [{x:layerX[li],y:H*0.38}]
      : Array.from({length:l[0]},(_,ni)=>({x:layerX[li],y:H*0.2+ni*(H*0.35/(l[0]-1))})));
    // Connections
    ctx.strokeStyle = 'rgba(160,240,180,0.2)'; ctx.lineWidth = 0.8;
    for (let li = 0; li < layers.length-1; li++) {
      nodes[li].forEach(a => nodes[li+1].forEach(b => {
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
      }));
    }
    // Nodes
    nodes.forEach((layer,li) => layer.forEach(n => {
      const grad = ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,8);
      grad.addColorStop(0,'#a0f0b4'); grad.addColorStop(1,'rgba(160,240,180,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(n.x,n.y,8,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#a0f0b4';
      ctx.beginPath(); ctx.arc(n.x,n.y,2.5,0,Math.PI*2); ctx.fill();
    }));
    drawCardText(ctx, W, H, p, '#c0ffcc', '#a0f0b4');
  }
};

function drawCardText(ctx, W, H, p, textColor, accentColor) {
  // Tag
  ctx.fillStyle = accentColor;
  ctx.font = `${Math.max(7, W*0.038)}px "Courier New"`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.globalAlpha = 0.9;
  ctx.fillText(p.tag.toUpperCase(), W*0.1, H*0.82);
  ctx.globalAlpha = 1;

  // Title
  ctx.fillStyle = textColor;
  ctx.font = `italic ${Math.max(11, W*0.07)}px Georgia, serif`;
  ctx.textAlign = 'left';
  const titleWords = p.title.split(' ');
  if (titleWords.length > 1 && W < 160) {
    ctx.fillText(titleWords[0], W*0.1, H*0.88);
    ctx.fillText(titleWords.slice(1).join(' '), W*0.1, H*0.88 + W*0.08);
  } else {
    ctx.fillText(p.title, W*0.1, H*0.88);
  }

  // Bottom separator
  ctx.strokeStyle = accentColor;
  ctx.lineWidth = 0.8; ctx.globalAlpha = 0.4;
  ctx.beginPath(); ctx.moveTo(W*0.1, H*0.76); ctx.lineTo(W*0.9, H*0.76); ctx.stroke();
  ctx.globalAlpha = 1;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);
  ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);
  ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r);
  ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}

function makeCardTexture(project, CW, CH) {
  const canvas = document.createElement('canvas');
  const scale = window.devicePixelRatio || 2;
  canvas.width = CW * scale;
  canvas.height = CH * scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);

  const drawFn = CARD_STYLES[project.id];
  if (drawFn) drawFn(ctx, CW, CH, project);

  const tex = new THREE.CanvasTexture(canvas);
  tex.minFilter = THREE.LinearFilter;
  return tex;
}

/* ══════════════════════════════════════
   SCENE SETUP
══════════════════════════════════════ */
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x0a0a0a);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 2000);

// Ambient light
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xfff0e0, 0.8);
dirLight.position.set(0, 2, 1);
scene.add(dirLight);

/* ══════════════════════════════════════
   BUILD CARDS
══════════════════════════════════════ */
let metrics = getMetrics();
let { CW, CH, R } = metrics;

const cardMeshes = [];
const cardGroup = new THREE.Group();
scene.add(cardGroup);

function buildCards() {
  // Clear old
  while (cardGroup.children.length) { cardGroup.remove(cardGroup.children[0]); }
  cardMeshes.length = 0;

  const { CW: cw, CH: ch } = getMetrics();

  PROJECTS.forEach((proj, i) => {
    const texture = makeCardTexture(proj, cw, ch);
    const geo = new THREE.PlaneGeometry(cw, ch);
    const mat = new THREE.MeshStandardMaterial({
      map: texture,
      side: THREE.FrontSide,
      roughness: 0.8,
      metalness: 0.05
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.userData = { project: proj, index: i };

    // Card back (dark panel)
    const backGeo = new THREE.PlaneGeometry(cw, ch);
    const backMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
    const back = new THREE.Mesh(backGeo, backMat);
    back.rotation.y = Math.PI;
    mesh.add(back);

    cardGroup.add(mesh);
    cardMeshes.push(mesh);
  });
}

buildCards();

/* ══════════════════════════════════════
   INTRO ANIMATION
══════════════════════════════════════ */
const FLY_START  = 1.4;   // s — first card begins flying
const STAGGER    = 0.11;  // s between cards
const FLY_DUR    = 0.6;   // s each card travels
const LAST_LAND  = FLY_START + (N-1)*STAGGER + FLY_DUR;
const INTRO_FADE = LAST_LAND + 0.2;  // overlay starts fading
const PHASE1_T   = INTRO_FADE + 0.9; // interactive starts

let phase = 0;
let clock = 0;
let introComplete = false;

// Scatter: cards start at random positions far away
const scatter = PROJECTS.map((_, i) => {
  const { R: Rcur } = getMetrics();
  return {
    px: (Math.random() - 0.5) * Rcur * 5.5,
    py: (Math.random() - 0.5) * Rcur * 3.5,
    pz: (Math.random() - 0.5) * Rcur * 4.5 - Rcur * 1.5,
    rx: Math.random() * Math.PI * 2,
    ry: Math.random() * Math.PI * 2,
    rz: Math.random() * Math.PI,
  };
});

function getRingPos(i, Rcur, angleOffset) {
  const baseAngle = (i / N) * Math.PI * 2 + angleOffset;
  return {
    x: Math.sin(baseAngle) * Rcur,
    y: 0,
    z: -Math.cos(baseAngle) * Rcur,
    ry: baseAngle + Math.PI * 2, // face inward
  };
}

// Trigger DOM intro text
const nameEl   = document.getElementById('name');
const roleEl   = document.getElementById('role');
const barWrap  = document.getElementById('bar-wrap');
const barFill  = document.getElementById('bar-fill');
const introFade = document.getElementById('intro-fade');
const hintEl   = document.getElementById('hint');

setTimeout(() => nameEl.classList.add('show'),   60);
setTimeout(() => roleEl.classList.add('show'),   380);
setTimeout(() => {
  barWrap.classList.add('show');
  setTimeout(() => { barFill.style.width = '100%'; }, 50);
}, 1200);

/* ══════════════════════════════════════
   INTERACTION STATE
══════════════════════════════════════ */
let carousel = {
  angle: 0,  // current angle of the carousel
  targetAngle: 0,
  velocity: 0,
  lastIdle: 0,
  autoRotateSpeed: 0.00018,
};

let mouseX = -9999, mouseY = -9999;
let hoveredCard = null;
let isDragging = false;
let lastDragX = 0;
let touchStartX = 0, touchLastX = 0, touchVX = 0;

/* ══════════════════════════════════════
   POPUP
══════════════════════════════════════ */
const popupOverlay = document.getElementById('popup-overlay');
const popupTag   = document.getElementById('popup-tag');
const popupTitle = document.getElementById('popup-title');
const popupDesc  = document.getElementById('popup-desc');
const popupLink  = document.getElementById('popup-link');
const popupTechs = document.getElementById('popup-techs');
const popupClose = document.getElementById('popup-close');

function openPopup(project) {
  popupTag.textContent   = project.tag;
  popupTitle.textContent = project.title;
  popupDesc.textContent  = project.desc;
  popupLink.href         = project.url;
  popupTechs.innerHTML   = project.techs.map(t => `<span class="tech-tag">${t}</span>`).join('');
  popupOverlay.classList.add('open');
}

popupClose.addEventListener('click', () => popupOverlay.classList.remove('open'));
popupOverlay.addEventListener('click', e => { if (e.target === popupOverlay) popupOverlay.classList.remove('open'); });

/* ══════════════════════════════════════
   CURSOR
══════════════════════════════════════ */
const cursorEl = document.getElementById('cursor');
document.addEventListener('mousemove', e => {
  cursorEl.style.left = e.clientX + 'px';
  cursorEl.style.top  = e.clientY + 'px';
  mouseX = (e.clientX / window.innerWidth)  * 2 - 1;
  mouseY = (e.clientY / window.innerHeight) * -2 + 1;
});

/* ══════════════════════════════════════
   SCROLL / WHEEL
══════════════════════════════════════ */
window.addEventListener('wheel', e => {
  if (!introComplete) return;
  e.preventDefault();
  const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  carousel.targetAngle += delta * 0.003;
  carousel.lastIdle = clock;
}, { passive: false });

/* ══════════════════════════════════════
   MOUSE DRAG
══════════════════════════════════════ */
document.addEventListener('mousedown', e => {
  if (!introComplete) return;
  isDragging = true;
  lastDragX = e.clientX;
});
document.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const dx = e.clientX - lastDragX;
  carousel.targetAngle -= dx * 0.004;
  lastDragX = e.clientX;
  carousel.lastIdle = clock;
});
document.addEventListener('mouseup', () => { isDragging = false; });

/* ══════════════════════════════════════
   TOUCH
══════════════════════════════════════ */
document.addEventListener('touchstart', e => {
  if (!introComplete) return;
  touchStartX = touchLastX = e.touches[0].clientX;
  touchVX = 0;
}, { passive: true });

document.addEventListener('touchmove', e => {
  if (!introComplete) return;
  const x = e.touches[0].clientX;
  const dx = x - touchLastX;
  touchVX = dx;
  carousel.targetAngle -= dx * 0.005;
  touchLastX = x;
  carousel.lastIdle = clock;
}, { passive: true });

document.addEventListener('touchend', e => {
  if (!introComplete) return;
  carousel.targetAngle -= touchVX * 5 * 0.005;
});

/* ══════════════════════════════════════
   CLICK / TAP
══════════════════════════════════════ */
document.addEventListener('click', e => {
  if (!introComplete) return;
  if (popupOverlay.classList.contains('open')) return;
  if (hoveredCard) openPopup(hoveredCard.userData.project);
});

/* ══════════════════════════════════════
   RAYCASTER
══════════════════════════════════════ */
const raycaster = new THREE.Raycaster();
const mouse2D   = new THREE.Vector2();

/* ══════════════════════════════════════
   RESIZE
══════════════════════════════════════ */
function onResize() {
  const W = window.innerWidth, H = window.innerHeight;
  renderer.setSize(W, H);
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
  metrics = getMetrics();
  ({ CW, CH, R } = metrics);
}
window.addEventListener('resize', onResize);
onResize();

/* ══════════════════════════════════════
   MAIN LOOP
══════════════════════════════════════ */
let lastTime = performance.now();

function animate(now) {
  requestAnimationFrame(animate);

  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;
  clock += dt;

  const { CW: cw, CH: ch, R: Rcur } = getMetrics();

  // ── Phase 0: Intro animation ──
  if (phase === 0) {

    // Camera pull-back: starts at R*1.5, eases to 0 by INTRO_FADE
    if (clock < INTRO_FADE) {
      const t = Math.min(clock / INTRO_FADE, 1);
      camera.position.z = Rcur * 1.5 * (1 - easeOutCubic(t));
    } else {
      camera.position.z = 0;
    }
    camera.position.x = 0;
    camera.position.y = 0;
    camera.lookAt(0, 0, -1);

    // Position each card
    cardMeshes.forEach((mesh, i) => {
      const flyDelay = FLY_START + i * STAGGER;
      const ring = getRingPos(i, Rcur, carousel.angle);

      if (clock < flyDelay) {
        // Scattered, spinning
        const s = scatter[i];
        mesh.position.set(s.px, s.py, s.pz);
        mesh.rotation.x = s.rx + clock * 0.3;
        mesh.rotation.y = s.ry + clock * 0.5;
        mesh.rotation.z = s.rz + clock * 0.2;

      } else {
        // Flying to ring
        const t = Math.min((clock - flyDelay) / FLY_DUR, 1);
        const ease = easeOutBack(t);

        const s = scatter[i];
        mesh.position.x = s.px + (ring.x - s.px) * ease;
        mesh.position.y = s.py + (ring.y - s.py) * ease;
        mesh.position.z = s.pz + (ring.z - s.pz) * ease;

        // Rotate to face-in
        const targetRY = ring.ry;
        const startRY  = s.ry;
        mesh.rotation.x = s.rx * (1 - ease);
        mesh.rotation.y = startRY + (targetRY - startRY) * ease;
        mesh.rotation.z = s.rz * (1 - ease);
      }
    });

    // Overlay fade
    if (clock >= INTRO_FADE) {
      introFade.classList.add('gone');
    }

    // Switch to phase 1
    if (clock >= PHASE1_T) {
      phase = 1;
      introComplete = true;
      carousel.lastIdle = clock;
      setTimeout(() => hintEl.classList.add('show'), 400);
    }

  // ── Phase 1: Interactive carousel ──
  } else {

    // Auto-rotate
    const idleTime = clock - carousel.lastIdle;
    if (idleTime > 3) {
      carousel.targetAngle += carousel.autoRotateSpeed * 60 * dt;
    }

    // Smooth angle
    const angleDiff = carousel.targetAngle - carousel.angle;
    carousel.angle += angleDiff * Math.min(dt * 8, 0.95);

    // Position all cards
    cardMeshes.forEach((mesh, i) => {
      const ring = getRingPos(i, Rcur, carousel.angle);
      mesh.position.set(ring.x,  ring.y, ring.z);
      mesh.rotation.set(0, ring.ry, 0);
    });

    // Camera
    camera.position.set(0, 0, 0);
    camera.lookAt(0, 0, -1);

    // Raycaster for hover
    mouse2D.set(mouseX, mouseY);
    raycaster.setFromCamera(mouse2D, camera);
    const hits = raycaster.intersectObjects(cardMeshes, false);
    const newHovered = hits.length > 0 ? hits[0].object : null;

    if (newHovered !== hoveredCard) {
      hoveredCard = newHovered;
      cursorEl.classList.toggle('big', !!hoveredCard);
    }

    // Scale hovered card
    cardMeshes.forEach(mesh => {
      const target = mesh === hoveredCard ? 1.06 : 1.0;
      mesh.scale.setScalar(mesh.scale.x + (target - mesh.scale.x) * Math.min(dt * 10, 1));
    });
  }

  renderer.render(scene, camera);
}

requestAnimationFrame(animate);
</script>
</body>
</html>
